<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Web Server - Victory!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            backdrop-filter: blur(10px);
            max-width: 450px;
        }
        h1 {
            color: #38bdf8;
            font-size: 3rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .badge {
            background: #10b981;
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">HTTP/1.1 200 OK</div>
        <h1>SUCCESS! 🎉</h1>
        <p>Chúc mừng bạn! Siêu dự án <b>HTTP Web Server bằng C++</b> chạy POSIX Socket trên nhân Linux (WSL) của Tri đã thông nòng và vận hành hoàn hảo 100%!</p>
    </div>
</body>
</html>
